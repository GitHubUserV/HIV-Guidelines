<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ivona Health</title>
<style>
body {
font-family: Arial, sans-serif;
background-color: #f0f0f5;
margin: 0;
padding: 0;
display: flex;
flex-direction: column;
align-items: center;
}

.top-logo {
background-color: #6a5acd;
color: white;
width: 100%;
text-align: center;
padding: 20px 0;
font-size: 36px;
font-weight: bold;
}

.headline {
background-color: #ff99cc;
color: black;
text-align: center;
padding: 15px 10px;
margin: 10px 0 20px 0;
font-size: 24px;
font-weight: bold;
border-radius: 8px;
}

.container {
display: flex;
justify-content: space-around;
align-items: stretch;
width: 100%;
max-width: 1200px;
gap: 20px;
}

.square {
background-color: #e6e6fa;
flex: 1;
min-width: 220px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
border-radius: 10px;
box-shadow: 0 2px 5px rgba(0,0,0,0.2);
cursor: pointer;
transition: all 0.3s ease;
text-align: center;
padding: 30px 10px;
}

.square:hover {
transform: translateY(-3px);
box-shadow: 0 5px 10px rgba(0,0,0,0.25);
}

.square img {
width: 100px;
height: 100px;
margin-bottom: 15px;
}

.circle-button {
background-color: #d1478f; /* Darker pink for contrast */
color: white;
border: none;
border-radius: 50%;
width: 80px;
height: 80px;
font-size: 16px;
font-weight: bold;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
margin-bottom: 15px;
text-shadow: 1px 1px 2px rgba(0,0,0,0.4); /* subtle shadow for pop */
}

.description {
font-weight: bold;
font-size: 14px;
color: black;
text-align: center;
max-width: 90%;
}

/* Responsive */
@media (max-width: 1000px) {
.container {
flex-wrap: wrap;
}
.square {
flex: 1 1 45%;
margin-bottom: 20px;
}
}
@media (max-width: 600px) {
.square {
flex: 1 1 100%;
}
}
</style>
</head>
<body>

<div class="top-logo">Ivona Health</div>
<div class="headline">HIV Guidelines: How To Protect Yourself Against HIV</div>

<div class="container">

<div class="square" onclick="window.location.href='pep2.html'">
<img src="pep.png" alt="PEP">
<div class="circle-button">PEP</div>
<div class="description">Use PEP after potential exposure.</div>
</div>

<div class="square" onclick="window.location.href='prep2.html'">
<img src="prep.png" alt="PrEP">
<div class="circle-button">PrEP</div>
<div class="description">PrEP reduces HIV risk if taken consistently.</div>
</div>

<div class="square" onclick="window.location.href='condoms2.html'">
<img src="condoms.png" alt="Condoms">
<div class="circle-button">Condoms</div>
<div class="description">Use condoms to protect yourself and partners.</div>
</div>

<div class="square" onclick="window.location.href='safesex2.html'">
<img src="safesex.png" alt="Safe Sex">
<div class="circle-button">Safe Sex</div>
<div class="description">Practice safe sex to minimize HIV risk.</div>
</div>

</div>
</body>
</html>
